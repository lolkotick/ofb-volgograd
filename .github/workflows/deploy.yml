# Сборка сайта и публикация на GitHub Pages.
# Запускается: при каждом push в main, вручную, и из workflow синхронизации новостей.
name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только одна публикация
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Собрать сайт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать статику
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.SITE_BASE || format('/{0}', github.event.repository.name) }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Опубликовать на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
